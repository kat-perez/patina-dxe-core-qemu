[package]
name = "qemu_dxe_core"
version = "2.1.1"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "qemu_q35_dxe_core"
path = "bin/q35_dxe_core.rs"
required-features = ["x64"]

[[bin]]
name = "qemu_sbsa_dxe_core"
path = "bin/sbsa_dxe_core.rs"
required-features = ["aarch64"]

[lib]
name = "qemu_resources"
path = "src/lib.rs"

[dependencies]
log = { version = "^0.4", default-features = false, features = [
  "release_max_level_warn",
] }
patina_adv_logger = { version = "19" }
patina_debugger = { version = "19" }
patina_dxe_core = { version = "19" }
patina_mm = { version = "19" }
patina_performance = { version = "19" }
patina_samples = { version = "19" }
patina_boot = { version = "19" }
patina = { version = "19", features = ["enable_patina_tests", "unstable-device-path"] }
patina_ffs_extractors = { version = "19" }
patina_stacktrace = { version = "19" }
r-efi = { version = "^5", default-features = false }
x86_64 = { version = "=0.15.2", default-features = false, features = [
  "instructions",
], optional = true }
zerocopy = { version = "0.8", features = ["derive"] }

# These release settings reduce the qemu binary size significantly(~35%).
[profile.release]
codegen-units = 1
debug = "full"
lto = true
opt-level = "s"
split-debuginfo = "packed"
strip = "symbols"
incremental = true

[profile.dev]
opt-level = "s"

[profile.test]
opt-level = 0

[features]
default = ["compatibility_mode_allowed"]
compatibility_mode_allowed = ["patina_dxe_core/compatibility_mode_allowed"]
v1_resource_descriptor_support = ["patina_dxe_core/v1_resource_descriptor_support"]
x64 = ["x86_64", "v1_resource_descriptor_support"]
aarch64 = ["v1_resource_descriptor_support"]
doc = []
std = []
build_debugger = []
enable_debugger = ["build_debugger"]

[patch.crates-io]
patina = { path = "/Users/katsu/work/projects/patina/sdk/patina" }
patina_adv_logger = { path = "/Users/katsu/work/projects/patina/components/patina_adv_logger" }
patina_debugger = { path = "/Users/katsu/work/projects/patina/core/patina_debugger" }
patina_dxe_core = { path = "/Users/katsu/work/projects/patina/patina_dxe_core" }
patina_ffs_extractors = { path = "/Users/katsu/work/projects/patina/sdk/patina_ffs_extractors" }
patina_mm = { path = "/Users/katsu/work/projects/patina/components/patina_mm" }
patina_performance = { path = "/Users/katsu/work/projects/patina/components/patina_performance" }
patina_samples = { path = "/Users/katsu/work/projects/patina/components/patina_samples" }
patina_boot = { path = "/Users/katsu/work/projects/patina/components/patina_boot" }
patina_stacktrace = { path = "/Users/katsu/work/projects/patina/core/patina_stacktrace" }
